name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Headroom for a bad runner, not a budget: the slowest leg, Windows, took
    # about a minute. A job that hangs stops here rather than at GitHub's six
    # hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor, 24 the active LTS, 26 the current release.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24', '26']
    steps:
      # Pinned to commits, with the tag beside each, as in the sibling tools.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No dependency's install script runs: the tree needs none, npm 12 runs
      # none unless package.json allows the package, and the flag has npm 10 and
      # 11 run none either (tests/npm.test.ts).
      - run: npm ci --ignore-scripts
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test with coverage
        run: npm run test:coverage

  # Every module here is copied into four tools; the sweep is the gate on
  # every change, not a weekly report. One runner took 67 to 164 minutes for
  # it, so it runs in shards, each mutating its own files against every test
  # (scripts/mutation-shards.mjs), and the job after them merges the reports
  # and applies the gate once, to the merged score (ADR-0007).
  mutation-shard:
    name: mutation (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # Headroom for a bad runner, not a budget: the shards took 2 to 9 minutes.
    # A shard that keeps passing 15 means the table in
    # scripts/mutation-shards.mjs needs re-measuring, not this number raising.
    timeout-minutes: 30
    strategy:
      # One broken shard should not hide what the others found. The merge
      # refuses to score a sweep with a shard missing either way.
      fail-fast: false
      matrix:
        # One entry per shard in scripts/mutation-shards.mjs; a test checks.
        shard: [1, 2, 3, 4, 5, 6]
    env:
      MUTATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      # `--no-install`: the sweep runs the Stryker that `npm ci` installed, and
      # a job that lost that step stops here, where npx alone would fetch
      # whatever the registry has under the name. `.npmrc` says the same for
      # every command (tests/npm.test.ts).
      - name: Mutation sweep, one shard
        run: |
          started=$SECONDS
          npx --no-install stryker run stryker.shard.config.mjs
          echo "{\"seconds\": $((SECONDS - started))}" > "reports/mutation/shard-$MUTATION_SHARD.timing.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: reports/mutation/shard-${{ matrix.shard }}*.json
          if-no-files-found: error
          retention-days: 14

  mutation:
    name: mutation
    needs: mutation-shard
    # Runs when a shard failed too, so the failure is reported as an incomplete
    # sweep rather than as a skipped check.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      # The merge scores with Stryker's own metrics library.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-shard-*
          path: reports/shards
      - name: Merge the shards and apply the gate
        run: node scripts/mutation-shards.mjs merge reports/shards
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation
          path: |
            reports/mutation/index.html
            reports/mutation/mutation.json
          if-no-files-found: ignore
