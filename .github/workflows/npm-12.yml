name: npm 12 (temporary)

# Temporary, and removed before this branch is reviewed: the suite, this
# repository's own checks and the release's own pack step under npm 12.2.0,
# which no Node carries yet, on the three platforms CI runs.
on:
  push:
    branches: [chore/npm-12-ready]

permissions:
  contents: read

jobs:
  npm-12:
    name: npm 12.2.0 (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24']
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '26'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: npm 12.2.0 in place of the npm Node carries
        run: |
          echo "node $(node --version) carries npm $(npm --version)"
          npm install -g npm@12.2.0
          test "$(npm --version)" = 12.2.0
      - run: npm ci --ignore-scripts
      - name: The install scripts npm 12 holds back, flag or no flag
        run: npm install-scripts ls || true
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
